name: Report a problem
description: Something in AbScout, PanelScout, Methods Writer or MITI Checker is wrong or broken.
title: "[Problem] "
labels: ["bug"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - AbScout
        - PanelScout
        - Methods Writer
        - MITI Checker
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. A search term, gene list or file layout that shows the problem helps a lot.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: e.g. Chrome 131 on macOS
  - type: markdown
    attributes:
      value: Please don't paste unpublished data, patient information or anything confidential. A few made-up rows that show the problem are enough.
